
title: Windows Recovery Protections Weakened
id: 3eecbf8b-3e9b-4e18-9e0c-45c5c3a11002
status: experimental
description: Detects selected commands that may disable shadow copies, remove backup catalogues, or weaken Windows recovery settings.
references:
    - https://attack.mitre.org/techniques/T1490/
author: Blue Team Learning Project
date: 2026/10/27
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    vssadmin_image:
        Image|endswith: '\vssadmin.exe'
    vssadmin_args:
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    wbadmin_image:
        Image|endswith: '\wbadmin.exe'
    wbadmin_args:
        CommandLine|contains|all:
            - 'delete'
            - 'catalog'
    bcdedit_image:
        Image|endswith: '\bcdedit.exe'
    bcdedit_recovery:
        CommandLine|contains|all:
            - 'recoveryenabled'
            - 'no'
    bcdedit_bootstatus:
        CommandLine|contains|all:
            - 'bootstatuspolicy'
            - 'ignoreallfailures'
    condition: (vssadmin_image and vssadmin_args) or (wbadmin_image and wbadmin_args) or (bcdedit_image and (bcdedit_recovery or bcdedit_bootstatus))
falsepositives:
    - Authorized disaster recovery testing
    - Backup administration and system maintenance
level: high
